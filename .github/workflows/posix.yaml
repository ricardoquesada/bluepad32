name: Posix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Patch BTStack
      shell: bash
      run: cd external/btstack && git apply ../patches/*.patch

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get -y install tzdata make pkg-config libusb-1.0-0-dev clang cmake

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install pkg-config libusb cmake

    - name: Configure and build unit tests (ASan + UBSan)
      shell: bash
      run: |
        cmake -S "${{ github.workspace }}/tests" -B "${{ github.workspace }}/tests/build" -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DENABLE_SANITIZERS=ON
        cmake --build "${{ github.workspace }}/tests/build" --config $BUILD_TYPE --parallel

    - name: Run unit tests via CTest
      shell: bash
      working-directory: ${{ github.workspace }}/tests/build
      run: ctest --output-on-failure -V

    - name: Create POSIX example build folder
      shell: bash
      run: |
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}/examples/posix/build"
        mkdir -p "${{ github.workspace }}/examples/posix/build"

    - name: Configure POSIX example CMake
      shell: bash
      working-directory: ${{ github.workspace }}/examples/posix/build
      run: cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build POSIX example
      working-directory: ${{ github.workspace }}/examples/posix/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE --parallel

