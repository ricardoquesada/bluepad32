# See https://pre-commit.com for more information
default_install_hook_types: [pre-commit]
minimum_pre_commit_version: '3.2.0'

# Global exclusions applied to all hooks:
# - external/: submodules (btstack), cloned deps (imgui), and git patches (*.patch)
# - src/components/(cmd_nvs|cmd_system): vendored upstream ESP-IDF components
# - *.gatt.h: auto-generated by BTstack's compile_gatt.py
exclude: |
  (?x)(
      ^external/|
      ^src/components/cmd_nvs/|
      ^src/components/cmd_system/|
      \.gatt\.h$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
        # Required because mkdocs.yml uses !!python/name: tags
        args: ['--unsafe']
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        # Restrict strictly to C/C++ so clang-format doesn't reformat JSON/JS/Proto files
        types_or: [c, c++]
        # Exclude upstream-derived btstack_config.h files
        exclude: 'btstack_config\.h$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: ['--fix']
      - id: ruff-format
